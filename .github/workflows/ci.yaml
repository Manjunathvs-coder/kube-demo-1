name: CI

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]
jobs:
    test-and-lint:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout code
              uses: actions/checkout@v4

            - name: use Node js
              uses: actions/setup-node@v4
              with:
                node-version: 18

            - name: Install Dependencies
              run: npm ci
            
            - name: Lint
              run: npm run lint

            - name: Run tests
              run: npm test